# Redirect non-www to www (primary domain)
[[redirects]]
  from = "https://ekoevents.co.uk/*"
  to = "https://www.ekoevents.co.uk/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── 301s for retired/moved URLs (clears Search Console 404s) ──

# Journal articles were once advertised under /journal/ but live at the root
[[redirects]]
  from = "/journal/*"
  to = "/:splat"
  status = 301

# Old blog structure
[[redirects]]
  from = "/blog/*"
  to = "/journal.html"
  status = 301

[[redirects]]
  from = "/2025/10/08/coastal-wedding-videography-dorset-hampshire/"
  to = "/coastal-wedding-videography-dorset-hampshire.html"
  status = 301

[[redirects]]
  from = "/2025/10/07/when-to-book-wedding-videographer-dorset-hampshire/"
